name: checks

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run catches Brewfile entries that Homebrew deprecated or disabled.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # zsh is needed by check_xdg_drift and ruby by `ruby -c Brewfile`.
      - run: sudo apt-get update -qq && sudo apt-get install -y jq python3 ruby shellcheck shfmt zsh ripgrep fd-find
      - run: |
          # Ubuntu names the fd binary fdfind; check-apps.sh expects fd.
          if command -v fdfind >/dev/null 2>&1 && ! command -v fd >/dev/null 2>&1; then
            sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd
          fi
      # actionlint isn't packaged for Ubuntu, but the runner image has Go.
      - run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make check

  bootstrap-linux:
    name: bootstrap-linux (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y git stow zsh
      # Not run from a terminal, so bootstrap skips the platform setup prompt.
      - run: ./bootstrap.sh
      - run: test -L "$HOME/.zshenv"
      # The runner image runs chmod -R 777 /usr/share, so compinit rejects zsh's
      # own function directories and aborts when it can't prompt on a terminal.
      - run: zsh -c 'autoload -Uz compaudit; compaudit' 2>/dev/null | xargs -r sudo chmod g-w,o-w
      # The runner's login shell is bash, which doctor reports as a warning
      # because CI is set.
      - run: make doctor
      # doctor never starts zsh, so check startup output separately.
      - run: |
          status=0
          errors="$(zsh -ic exit 2>&1 >/dev/null)" || status=$?
          if [[ -n "$errors" ]]; then
            printf 'zsh wrote to stderr:\n%s\n' "$errors"
            exit 1
          fi
          exit "$status"
        shell: bash

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Release binary checked against the sha256 file published with it.
      - run: |
          version=8.30.1
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/gitleaks_${version}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${version}_checksums.txt"
          tar -xzf "$archive" gitleaks
          ./gitleaks git --redact --verbose .

  macos:
    runs-on: macos-latest
    # macOS runners can queue for 15+ minutes and queued time counts against
    # this timeout; the job itself needs about a minute.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every entry comes from the default taps, so a missing name means the
      # formula or cask was renamed or removed. Deprecated and disabled entries
      # fail too.
      - run: |
          brew bundle list --file Brewfile --formula | xargs brew info --json=v2 --formula |
            jq -e '[.formulae[] | select(.deprecated or .disabled) | .full_name] | if length == 0 then true else ("deprecated or disabled formulae: " + join(" ") | halt_error(1)) end'
          brew bundle list --file Brewfile --cask | xargs brew info --json=v2 --cask |
            jq -e '[.casks[] | select(.deprecated or .disabled) | .token] | if length == 0 then true else ("deprecated or disabled casks: " + join(" ") | halt_error(1)) end'
      - run: brew install stow
      # bash 3.2 is what a fresh Mac has, so run the scripts with it.
      - run: /bin/bash ./bootstrap.sh --skip-preflight
      # One link from each stow package.
      - run: |
          test -L "$HOME/.zshenv"
          test -L "$HOME/.config/zsh/.zshrc"
          test -L "$HOME/.local/share/gradle/gradle.properties"
          test -L "$HOME/.config/linearmouse/linearmouse.json"
      # Full `make doctor` fails on a hosted runner: FileVault is off and the
      # Brewfile commands aren't installed, so only the stow checks run.
      - run: /bin/bash ./scripts/doctor.sh --only stow
