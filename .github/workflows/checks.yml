name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # zsh is needed by check_xdg_drift and ruby by `ruby -c Brewfile`.
      - run: sudo apt-get update -qq && sudo apt-get install -y jq python3 ruby shellcheck shfmt zsh ripgrep fd-find
      - run: |
          # Ubuntu names the fd binary fdfind; check-apps.sh expects fd.
          if command -v fdfind >/dev/null 2>&1 && ! command -v fd >/dev/null 2>&1; then
            sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd
          fi
      # actionlint isn't packaged for Ubuntu, but the runner image has Go.
      - run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make check

  bootstrap-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -qq && sudo apt-get install -y git stow zsh
      # Not run from a terminal, so bootstrap skips the platform setup prompt.
      - run: ./bootstrap.sh
      - run: test -L "$HOME/.zshenv"
      # The runner image runs chmod -R 777 /usr/share, so compinit rejects zsh's
      # own function directories and aborts when it can't prompt on a terminal.
      - run: zsh -c 'autoload -Uz compaudit; compaudit' 2>/dev/null | xargs -r sudo chmod g-w,o-w
      # The runner's login shell is bash, which doctor reports as a warning
      # because CI is set.
      - run: make doctor
      # doctor never starts zsh, so check startup output separately.
      - run: |
          status=0
          errors="$(zsh -ic exit 2>&1 >/dev/null)" || status=$?
          if [[ -n "$errors" ]]; then
            printf 'zsh wrote to stderr:\n%s\n' "$errors"
            exit 1
          fi
          exit "$status"
        shell: bash

  brewfile-names:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Every entry comes from the default taps, so a missing name means the
      # formula or cask was renamed or removed.
      - run: |
          brew bundle list --file Brewfile --formula | xargs brew info --formula >/dev/null
          brew bundle list --file Brewfile --cask | xargs brew info --cask >/dev/null

  bootstrap-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: brew install stow
      - run: ./bootstrap.sh --skip-preflight
      # One link from each stow package.
      - run: |
          test -L "$HOME/.zshenv"
          test -L "$HOME/.config/zsh/.zshrc"
          test -L "$HOME/.local/share/gradle/gradle.properties"
          test -L "$HOME/.config/linearmouse/linearmouse.json"
      # Full `make doctor` fails on a hosted runner: FileVault is off and the
      # Brewfile commands aren't installed. Only its stow check is asserted,
      # by the pass line it prints. Rewording that line in doctor.sh breaks
      # this step.
      - run: |
          ./scripts/doctor.sh >doctor.log 2>&1 || true
          if ! grep -qF 'all managed files in home config data config-macos are linked' doctor.log; then
            cat doctor.log
            echo "doctor did not report the stow links as healthy" >&2
            exit 1
          fi
        env:
          NO_COLOR: "1"
