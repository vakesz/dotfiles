[misc]
# Homebrew owns the installed Bun, Claude Code, Codex, OpenCode, and uv
# binaries. Project-local managers own the JavaScript package-manager steps.
disable = [
    "bun",
    "bun_packages",
    "claude_code",
    "codex",
    "containers",
    "dotnet",
    "microsoft_office",
    "node",
    "opencode",
    "pnpm",
    "uv",
    "yarn",
]
assume_yes = true
display_time = true
cleanup = true
notify_end = "never"

[brew]
greedy_cask = true
greedy_latest = true
greedy_auto_updates = true
autoremove = true

[git]
repos = ["~/Code/*/", "~/Work/*/"]

[firmware]
upgrade = true
