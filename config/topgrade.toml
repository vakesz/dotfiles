[misc]
# Homebrew updates Bun, Claude Code, Codex and uv. JavaScript packages are
# managed per project, so skip the global package-manager steps too.
disable = [
    "bun",
    "bun_packages",
    "claude_code",
    "codex",
    "containers",
    "microsoft_office",
    "node",
    "pnpm",
    "uv",
    "yarn",
]
assume_yes = true
cleanup = true
notify_end = "never"

[brew]
greedy_cask = true
autoremove = true

[git]
repos = ["~/Code/*/", "~/Work/*/"]
pull_predefined = false
fallback_to_fetch_default = true

[firmware]
upgrade = true
