# tealdeer (tldr): https://github.com/tealdeer-rs/tealdeer

[display]
compact = false
use_pager = false

# Use ANSI palette slots so Ghostty's Xcode Light/Dark themes choose readable colors.

[style.command_name]
foreground = { ansi = 4 }
bold = true

[style.example_text]
foreground = { ansi = 2 }

[style.example_variable]
foreground = { ansi = 6 }
underline = true
