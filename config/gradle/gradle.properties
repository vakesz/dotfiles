# User-wide Gradle settings. bootstrap.sh links this file into
# $GRADLE_USER_HOME, which is the only place Gradle reads user settings from.
# Values here override a project's own gradle.properties.

# Build independent modules in parallel.
org.gradle.parallel=true
# Reuse task outputs from earlier builds, including other branches and worktrees.
org.gradle.caching=true
# Skip the configuration phase when build scripts haven't changed. Some React
# Native and Expo plugins aren't compatible yet, so report problems as warnings
# instead of failing the build. Pass --no-configuration-cache if one misbehaves.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
