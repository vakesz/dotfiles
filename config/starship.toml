continuation_prompt = "[❯❯ ](bright-black)"
format = """
$directory\
$git_status\
$git_branch\
$git_state\
$c\
$swift\
$nodejs\
$python \
$character"""

right_format = "$cmd_duration"
# git_status in large repos can exceed the 500ms default on a cold cache.
command_timeout = 5000
scan_timeout = 1000

[directory]
format = "[$path]($style)"
style = "cyan"
truncation_length = 0
truncate_to_repo = false

[git_branch]
format = " [$branch]($style)"
style = "white"

[git_state]
format = ' \([$state( $progress_current/$progress_total)]($style)\)'
style = "bright-black"

[git_status]
# Shell out to git so core.fsmonitor and core.untrackedcache from
# config/git/config apply; the built-in library ignores both.
use_git_executable = true
format = " [](white)[($all_status)](magenta)[($ahead_behind)]($style)"
style = "cyan"
conflicted = "!"
deleted = "-"
modified = "*"
renamed = ">"
staged = "+"
stashed = "≡"
typechanged = "~"
untracked = "?"
ahead = "⇡"
behind = "⇣"
diverged = "⇣⇡"

[c]
symbol = ""
detect_extensions = ["c", "h"]
detect_files = ["compile_commands.json", "CMakeLists.txt"]
format = " [$symbol]($style)"
style = "cyan"

[swift]
symbol = ""
detect_extensions = ["swift"]
detect_files = ["Package.swift", "project.yml"]
format = " [$symbol]($style)"
style = "magenta"

[nodejs]
symbol = ""
detect_extensions = []
detect_files = ["package.json", ".node-version", ".nvmrc"]
detect_folders = []
format = " [$symbol]($style)"
style = "yellow"

[python]
symbol = ""
detect_extensions = []
detect_files = []
detect_env_vars = ["VIRTUAL_ENV"]
format = " [$symbol]($style)"
style = "yellow"

[cmd_duration]
format = "[  $duration]($style)"
min_time = 5000
style = "yellow"

[character]
error_symbol = "[❯](red)"
success_symbol = "[❯](bright-black)"
